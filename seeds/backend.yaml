# HeyHey! Backend Seeds
# Established: 2026-01-09 (Founding Convoy)
# Mode: seeding

services:
  # === Room Management ===
  RoomManager:
    location: packages/shared/src/room/RoomManager.ts
    package: shared
    responsibilities:
      - Create rooms with unique codes
      - Join/leave room operations
      - Host transfer on leave
      - Room lifecycle (close when empty)
    when_to_use: "Core room CRUD operations"
    justification: "Foundational multiplayer primitive. Stateless room logic."
    forbidden_extensions:
      - Game state (use GameManager)
      - Settings storage (use LobbyManager)

  LobbyManager:
    location: packages/server/src/events/LobbyManager.ts
    package: server
    responsibilities:
      - Extends RoomManager with settings
      - Socket-to-room mapping
      - Game settings validation
      - Start game authorization (host only)
    when_to_use: "Pre-game lobby orchestration"
    justification: "Server-side room state with socket tracking."
    depends_on:
      - RoomManager

  # === Game Management ===
  GameManager:
    location: packages/server/src/events/GameManager.ts
    package: server
    responsibilities:
      - Track active game sessions
      - Route moves to correct game
      - Foundation conflict resolution
      - Broadcast state updates
    when_to_use: "Server-authoritative game session management"
    justification: "CONSTITUTION: Server validates all moves. First wins."

  SetupManager:
    location: packages/server/src/events/SetupManager.ts
    package: server
    responsibilities:
      - Track setup completion per player
      - Coordinate transition from setup to playing
      - Broadcast ready states
    when_to_use: "Setup phase coordination"
    justification: "All players must complete setup before game starts."

  # === State Management ===
  StateManager:
    location: packages/shared/src/engine/StateManager.ts
    package: shared
    responsibilities:
      - Apply moves to game state
      - Generate delta updates
      - Sequence number management
      - Nertz call handling
    when_to_use: "Mutate game state and track changes"
    justification: "Single source of state mutation. Delta-based sync."

  RulesEngine:
    location: packages/shared/src/engine/RulesEngine.ts
    package: shared
    responsibilities:
      - Validate all move types
      - Work pile rules (descending, alternating colors)
      - Foundation rules (ascending, same suit)
      - Find valid destinations for card
    when_to_use: "Move validation before state mutation"
    justification: "Shared between client (optimistic) and server (authoritative)."
    pure_functions: true
    forbidden_extensions:
      - State mutation (use StateManager)

  SetupStateMachine:
    location: packages/shared/src/engine/SetupStateMachine.ts
    package: shared
    responsibilities:
      - Setup phase states (idle, placingNertz, flipNertz, placingWork, complete)
      - Validate state transitions
      - Track progress (cards placed)
    when_to_use: "Setup phase flow control"
    justification: "Deterministic setup sequence per CONSTITUTION."

utilities:
  roomCode:
    location: packages/shared/src/room/roomCode.ts
    package: shared
    responsibilities:
      - Generate unique room codes (HEYHEY-XXXX)
      - Validate and normalize codes
      - Avoid ambiguous characters (0/O, 1/I/L)
    when_to_use: "Room code generation and validation"
    justification: "Human-readable, typeable room identifiers."

  deck:
    location: packages/shared/src/deck/index.ts
    package: shared
    responsibilities:
      - Create 52-card decks
      - Fisher-Yates shuffle
      - Card color helpers (isRed, isBlack)
      - Card display names
    when_to_use: "Deck creation and card utilities"
    justification: "Core card game primitives. Pure functions."

socket_events:
  # === Lobby Events (Client → Server) ===
  createRoom:
    direction: client_to_server
    payload: CreateRoomPayload
    response: roomCreated
    when_to_use: "Player creates a new room"

  joinRoom:
    direction: client_to_server
    payload: JoinRoomPayload
    response: roomJoined | error
    broadcast: playerJoined (to room)
    when_to_use: "Player joins existing room by code"

  leaveRoom:
    direction: client_to_server
    response: none
    broadcast: playerLeft (to room), hostChanged (if host left)
    when_to_use: "Player leaves current room"

  updateSettings:
    direction: client_to_server
    payload: UpdateSettingsPayload
    authorization: host_only
    broadcast: settingsUpdated (to room)
    when_to_use: "Host changes game settings"

  startGame:
    direction: client_to_server
    authorization: host_only
    validation: minimum 2 players
    broadcast: gameStarted (to room)
    when_to_use: "Host starts the game"

  # === Lobby Events (Server → Client) ===
  roomCreated:
    direction: server_to_client
    payload: RoomCreatedPayload
    when_to_use: "Confirm room creation to creator"

  roomJoined:
    direction: server_to_client
    payload: RoomJoinedPayload
    when_to_use: "Confirm room join to joining player"

  playerJoined:
    direction: server_to_client
    payload: PlayerJoinedPayload
    when_to_use: "Notify room when new player joins"

  playerLeft:
    direction: server_to_client
    payload: PlayerLeftPayload
    when_to_use: "Notify room when player leaves"

  settingsUpdated:
    direction: server_to_client
    payload: SettingsUpdatedPayload
    when_to_use: "Broadcast settings change to room"

  gameStarted:
    direction: server_to_client
    payload: GameStartedPayload
    when_to_use: "Transition room to game phase"

  hostChanged:
    direction: server_to_client
    payload: HostChangedPayload
    when_to_use: "Notify room of new host"

  error:
    direction: server_to_client
    payload: ErrorPayload
    when_to_use: "Report errors to client"

  # === Setup Events ===
  setupComplete:
    direction: client_to_server
    when_to_use: "Player finished manual setup"

  playerSetupComplete:
    direction: server_to_client
    payload: { playerId, playersReady, totalPlayers }
    broadcast: to_room
    when_to_use: "Broadcast setup progress"

  allPlayersReady:
    direction: server_to_client
    payload: { gameId }
    broadcast: to_room
    when_to_use: "All players ready, transition to playing"

  # === Game Events (Client → Server) ===
  makeMove:
    direction: client_to_server
    payload: MakeMovePayload
    response: stateUpdate | moveRejected
    when_to_use: "Player attempts a move"

  foundationMove:
    direction: client_to_server
    payload: FoundationMovePayload
    response: foundationUpdated | foundationMoveRejected
    when_to_use: "Player plays card to shared foundation"

  callNertz:
    direction: client_to_server
    validation: nertz pile must be empty
    broadcast: gameEnded (to room)
    when_to_use: "Player calls HeyHey (wins round)"

  # === Game Events (Server → Client) ===
  stateUpdate:
    direction: server_to_client
    payload: StateUpdate
    when_to_use: "Broadcast state delta to all players"

  moveRejected:
    direction: server_to_client
    payload: MoveRejection
    when_to_use: "Notify player of invalid move"

  foundationUpdated:
    direction: server_to_client
    payload: FoundationUpdatedPayload
    broadcast: to_room
    when_to_use: "Broadcast foundation change"

  foundationMoveRejected:
    direction: server_to_client
    payload: FoundationMoveRejectedPayload
    when_to_use: "Notify player foundation move failed"

  gameEnded:
    direction: server_to_client
    payload: GameEndedPayload
    broadcast: to_room
    when_to_use: "Round ended, show scores"

api_routes:
  # Note: HeyHey uses WebSocket for all game communication
  # REST endpoints are minimal

  "GET /health":
    purpose: "Health check for load balancer"
    auth_required: false
    justification: "Standard infrastructure endpoint."
